0}.grid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(310px,1fr);gap:15px}.panel{background:white;border:1px solid #f3edf0;border-radius:13px;padding:16px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#fff6f8;font-weight:500;text-align:left}th,td{padding:12px 9px;border-bottom:1px solid #f3edf0;white-space:nowrap}td:last-child{text-align:right}.pill{display:inline-block;padding:7px 10px;border-radius:20px;font-size:12px;background:#e9f2ff;color:#1c62af}.pill.done{background:#e3f7eb;color:#117947}.pill.late{background:#ffe5eb;color:#ae234a}.pill.soon{background:#fff0d3;color:#885511}.mini{border:0;background:#fff0f4;color:#b52e58;border-radius:7px;padding:7px 9px}.months{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{text-align:center;border-radius:8px;padding:8px 0;border:1px solid transparent;background:#faf9fa;font-size:12px}.day.has{background:#ffe3eb;border-color:#f4b5c7;cursor:pointer}.days-title{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:7px}.due{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;gap:6px}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-top:15px}.bar{background:#f5edf1;height:11px;border-radius:10px;overflow:hidden;margin-top:8px}.bar span{display:block;background:#e75b83;height:100%}.item{padding:10px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:grid;gap:6px;font-weight:600;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #e8dfe4;border-radius:9px;font:inherit;background:white}textarea{min-height:75px;resize:vertical}.overlay{position:fixed;inset:0;background:#1720337a;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:white;border-radius:16px;padding:24px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.close{background:none;border:0;font-size:24px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}.note{background:#fff5f8;border:1px solid #f5e2e8;border-radius:10px;padding:12px;white-space:pre-wrap}.hint{font-size:12px;color:#738092}.full{grid-column:1/-1}.empty{color:#89919f;padding:24px;text-align:center}.monthnav{display:flex;align-items:center;gap:10px}.monthnav button{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 11px}@media(max-width:1200px){.stats{grid-template-columns:repeat(2,1fr)}.bottom{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}aside{width:100%;height:auto;position:static;padding:10px}.brand{font-size:18px;padding:6px}.brand span{font-size:24px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto;padding:10px}.side-actions{display:flex;margin:7px 0}main{padding:14px}.stats,.bottom{grid-template-columns:1fr 1fr}.stat{padding:12px;gap:5px}.stat strong{font-size:18px}.emoji{font-size:20px;padding:6px}.search{min-width:0;width:100%}.topright{width:100%}.date{display:none}.formgrid{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}}
.collapse-heading{border:0;background:transparent;text-align:left;font-size:18px;font-weight:700;color:var(--ink);padding:8px 2px}.collapse-heading:hover{color:#b52855}.sum-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:400;font-size:14px}.sum-row span{display:flex;align-items:center;gap:8px}.sum-row input{width:auto;accent-color:var(--pink)}.sum-total{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding:17px;background:var(--light);border-radius:12px}.sum-total strong{font-size:23px}.history-month{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:14px}.history-month summary{cursor:pointer;text-transform:capitalize}@media(max-width:700px){.sum-total{align-items:flex-start;flex-direction:column}.collapse-heading{font-size:15px}}</style></head><body><div class="app"><aside><div class="brand"><span>👛</span><div>Meu Controle<br>de Contas</div></div><nav id="nav"></nav><div class="side-actions"><button class="primary" onclick="openForm('debt')">＋ Nova Dívida</button></div></aside><main><div class="top"><div><h1>Olá! 💗</h1><div class="muted">Aqui você acompanha todas as suas contas e dívidas em um só lugar.</div></div><div class="topright"><input id="search" class="search" placeholder="⌕ Buscar conta ou dívida..." oninput="render()"><div class="date" id="today"></div></div></div><div id="stats" class="stats"></div><div id="content"></div></main></div><div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><script>
const KEY='velotec-financeiro-v1';let data=load(),page='Início',month=new Date(),debtsExpanded=false,totalExpanded=false,sumMonth=new Date().toLocaleDateString('en-CA').slice(0,7),sumSelected=new Set();month.setDate(1);const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const dateBR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.debts)&&Array.isArray(d.fixed)&&Array.isArray(d.notes))return {...d,groups:Array.isArray(d.groups)?d.groups:[]}}catch(e){}return {debts:[],fixed:[],notes:[],groups:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render();syncCloud()}function addMonths(s,n){let [y,m,d]=s.split('-').map(Number),z=new Date(y,m-1+n,1),last=new Date(z.getFullYear(),z.getMonth()+1,0).getDate();return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}function currentMonth(s){return s.slice(0,7)}function debtInstallments(d){let amount=Number(d.total),count=Number(d.count),base=Math.round(amount/count*100)/100;return Array.from({length:count},(_,i)=>({index:i,date:addMonths(d.start,i),due:i===count-1?Math.round((amount-base*(count-1))*100)/100:base,paid:Math.round((d.payments||[]).filter(p=>p.index===i).reduce((a,p)=>a+Number(p.amount),0)*100)/100}))}function dueItems(){let arr=[];data.debts.forEach(d=>debtInstallments(d).forEach(p=>{if(p.due-p.paid>.009)arr.push({date:p.date,title:d.name+' · '+(p.index+1)+'/'+d.count,value:p.due-p.paid,type:'debt',id:d.id,index:p.index})}));let start=new Date(month.getFullYear()-1,0,1),end=new Date(month.getFullYear()+2,11,31);data.fixed.forEach(f=>{for(let y=start.getFullYear();y<=end.getFullYear();y++)for(let m=0;m<12;m++){let day=Math.min(Number(f.day),new Date(y,m+1,0).getDate()),s=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;if(s<(f.start||'0000-00-00')||f.end&&s>f.end)continue;let paid=(f.payments||[]).filter(p=>p.month===s.slice(0,7)).reduce((a,p)=>a+Number(p.amount),0),v=Math.max(0,Number(f.amount)-paid);if(v>.009)arr.push({date:s,title:f.name,value:v,type:'fixed',id:f.id,month:s.slice(0,7)})}});return arr.filter(x=>x.type==='debt').sort((a,b)=>a.date.localeCompare(b.date))}function fixedMonthTotals(ym){let paid=0,remaining=0,total=0,active=0;data.fixed.forEach(f=>{let [y,m]=ym.split('-').map(Number),day=Math.min(Number(f.day),new Date(y,m,0).getDate()),due=ym+'-'+String(day).padStart(2,'0');if(due<(f.start||'0000-00-00')||(f.end&&due>f.end))return;let v=Number(f.amount)||0,p=(f.payments||[]).filter(x=>x.month===ym).reduce((a,x)=>a+Number(x.amount),0);total+=v;paid+=Math.min(v,p);remaining+=Math.max(0,v-p);active++});return {total,paid,remaining,active}}function allRemaining(){return data.debts.reduce((a,d)=>a+debtInstallments(d).reduce((s,p)=>s+Math.max(0,p.due-p.paid),0),0)}function paidTotal(){return data.debts.reduce((a,d)=>a+(d.payments||[]).reduce((s,p)=>s+Number(p.amount),0),0)}function stats(){let debtTotal=data.debts.reduce((a,d)=>a+Number(d.total),0),debtPaid=paidTotal(),debtRem=allRemaining(),ym=localToday().slice(0,7),monthly=dueItems().filter(x=>x.type==='debt'&&x.date.startsWith(ym)).reduce((a,x)=>a+x.value,0),active=data.debts.filter(d=>debtInstallments(d).some(p=>p.due-p.paid>.009)).length;return `<div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="toggleTotal()" onkeydown="if(event.key==='Enter'){toggleTotal()}"><div class="emoji">▣</div><div><span>Total de Dívidas</span><strong>${totalExpanded?brl(debtTotal):'••••••'}</strong><span class="muted">${totalExpanded?active+' dívidas em andamento':'Clique para visualizar'}</span></div></div>`+[['✓','Já Paguei',brl(debtPaid),`${debtTotal?Math.round(debtPaid/debtTotal*100):0}% do total`],['⌛','Falta Pagar',brl(debtRem),`${debtTotal?Math.round(debtRem/debtTotal*100):0}% do total`],['▦','Contas deste Mês',brl(monthly),'Ainda pendentes neste mês']].map(a=>`<div class="stat"><div class="emoji">${a[0]}</div><div><span>${a[1]}</span><strong>${a[2]}</strong><span class="muted">${a[3]}</span></div></div>`).join('')}
function toggleTotal(){totalExpanded=!totalExpanded;render()}
function toggleDebts(){debtsExpanded=!debtsExpanded;render()}
const tabs=[['⌂','Início'],['▤','Minhas Dívidas'],['▦','Calendário'],['▥','Relatórios'],['♧','Somar Parcelas do Mês'],['✎','Anotações'],['◴','Histórico'],['⚙','Configurações']];function navTo(p){page=p;render()}function render(){document.getElementById('nav').innerHTML=tabs.map(([i,t])=>`<button class="${page===t?'active':''}" onclick="navTo('${t}')">${i} &nbsp; ${t}</button>`).join('');document.getElementById('today').innerHTML=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('stats').innerHTML=stats();let html='';if(page==='Início'){html=`<div class="grid"><section class="panel">${debtTable(true)}</section><section class="panel">${calendar(true)}</section></div><div class="bottom"><section class="panel">${monthPending()}</section><section class="panel">${reports(true)}</section><section class="panel">${alerts()}<hr style="border:0;border-top:1px solid var(--line);margin:17px 0">${notes(true)}</section></div>`}else if(page==='Minhas Dívidas')html=`<section class="panel">${debtTable(false)}</section>`;else if(page==='Calendário')html=`<section class="panel">${calendar(false)}</section>`;else if(page==='Relatórios')html=`<section class="panel">${reports(false)}</section>`;else if(page==='Somar Parcelas do Mês')html=`<section class="panel">${sumMonthPage()}</section>`;else if(page==='Anotações')html=`<section class="panel">${notes(false)}</section>`;else if(page==='Histórico')html=`<section class="panel"><h2>Histórico de pagamentos</h2>${history()}</section>`;else html=`<section class="panel"><h2>Configurações</h2><p class="muted">Suas contas e pagamentos são sincronizados pelo Firebase com sua conta Google.</p></section>`;document.getElementById('content').innerHTML=html}function match(n){return n.toLowerCase().includes((document.getElementById('search').value||'').toLowerCase())}function debtTable(short){let rows=data.debts.filter(d=>match(d.name)&&(!short||debtInstallments(d).some(p=>p.due-p.paid>.009))).map(d=>{let ins=debtInstallments(d),paid=ins.filter(p=>p.due-p.paid<.009).length,rem=ins.reduce((a,p)=>a+Math.max(0,p.due-p.paid),0),late=ins.some(p=>p.date<localToday()&&p.due-p.paid>.009);return `<tr><td>💳 ${esc(d.name)}</td><td>${brl(d.total)}</td><td>${d.count}x</td><td>${dateBR(d.start)}</td><td>${dateBR(addMonths(d.start,d.count-1))}</td><td>${paid}/${d.count}</td><td>${brl(rem)}</td><td><span class="pill ${rem<.009?'done':late?'late':''}">${rem<.009?'Quitado':late?'Atrasado':'Em andamento'}</span></td><td><button class="mini" onclick="debtDetail('${d.id}')">Ver / Pagar</button></td></tr>`}).join('');return `<div class="head"><button class="collapse-heading" onclick="toggleDebts()">${debtsExpanded?'▾':'▸'} Minhas Dívidas e Parcelamentos</button><button class="primary" onclick="openForm('debt')">＋ Adicionar Dívida</button></div><div class="scroll ${debtsExpanded?'':'hidden'}"><table><thead><tr>${['Nome','Valor Total','Parcelas','Início','Última Parcela','Pago','Falta','Status','Ações'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Nenhuma dívida cadastrada.</td></tr>'}</tbody></table></div>`}function monthPending(){let ym=localToday().slice(0,7),list=dueItems().filter(x=>x.type==='debt'&&x.date.startsWith(ym));return `<div class="head"><h2>Parcelas Pendentes do Mês</h2></div>${list.map(x=>`<div class="due"><span>${esc(x.title)} · ${dateBR(x.date)}</span><span><b>${brl(x.value)}</b> <button class="mini" onclick="payForm('debt','${x.id}',${x.index})">Pagar</button></span></div>`).join('')||'<p class="muted">Nenhuma parcela pendente neste mês. 💗</p>'}`}
function sumMonthPage(){let entries=[];data.debts.forEach(d=>debtInstallments(d).forEach(p=>{if(p.date.slice(0,7)===sumMonth){let rem=Math.max(0,p.due-p.paid);entries.push({key:d.id+':'+p.index,name:d.name,index:p.index+1,count:d.count,amount:rem,paid:rem<.009})}}));let total=entries.filter(e=>sumSelected.has(e.key)).reduce((a,e)=>a+e.amount,0);return `<div class="head"><h2>Somar Parcelas do Mês</h2></div><p class="muted">Escolha o mês e marque as parcelas que deseja somar. O valor considera o que ainda falta pagar. Não altera suas contas.</p><label style="max-width:240px">Escolher mês<input type="month" value="${sumMonth}" onchange="changeSumMonth(this.value)"></label><div style="margin-top:16px">${entries.map(e=>`<label class="sum-row"><span><input type="checkbox" ${sumSelected.has(e.key)?'checked':''} onchange="toggleSumItem('${e.key}',this.checked)"> ${esc(e.name)} · ${e.index}/${e.count} ${e.paid?'(paga)':''}</span><b>${brl(e.amount)}</b></label>`).join('')||'<p class="empty">Nenhuma parcela cadastrada para este mês.</p>'}</div><div class="sum-total"><span>Total das parcelas selecionadas</span><strong>${brl(total)}</strong></div>`}
function changeSumMonth(v){if(!/^\d{4}-\d{2}$/.test(v))return;sumMonth=v;sumSelected.clear();render()}
function toggleSumItem(key,checked){if(checked)sumSelected.add(key);else sumSelected.delete(key);render()}
function fixedTable(short){let ym=localToday().slice(0,7),rows=data.fixed.filter(f=>match(f.name)).map(f=>{let paid=(f.payments||[]).filter(p=>p.month===ym).reduce((a,p)=>a+Number(p.amount),0),rem=Math.max(0,Number(f.amount)-paid);return `<tr><td>${esc(f.name)}</td><td>Dia ${f.day}</td><td>${brl(f.amount)}</td><td><span class="pill ${rem<.009?'done':''}">${rem<.009?'Pago':paid>0?'Parcial':'Pendente'}</span></td><td><button class="mini" onclick="fixedDetail('${f.id}')">Ver / Pagar</button></td></tr>`}).join('');return `<div class="head"><h2>Contas Fixas do Mês</h2><button class="mini" onclick="openForm('fixed')">＋ Nova</button></div><div class="scroll"><table><thead><tr><th>Conta</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Nenhuma conta fixa cadastrada.</td></tr>'}</tbody></table></div>`}function calendar(short){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),items=dueItems().filter(x=>x.date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`),byDay=new Map();items.forEach(x=>byDay.set(Number(x.date.slice(8)),(byDay.get(Number(x.date.slice(8)))||0)+1));let cells=Array.from({length:first},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>`<div class="day ${byDay.has(i+1)?'has':''}" title="${byDay.get(i+1)||0} vencimento(s)" onclick="showDay(${i+1})">${i+1}</div>`).join('');return `<div class="head"><h2>Calendário de Vencimentos</h2><div class="monthnav"><button onclick="changeMonth(-1)">‹</button><b>${month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button onclick="changeMonth(1)">›</button></div></div><div class="days-title">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div>${x}</div>`).join('')}</div><div class="months">${cells}</div><h3 style="font-size:14px;margin:20px 0 7px">Vencimentos do mês</h3>${items.length?items.slice(0,short?7:100).map(x=>`<div class="due"><span>${dateBR(x.date)} const valid=d=>d&&Array.isArray(d.debts)&&Array.isArray(d.fixed)&&Array.isArray(d.notes);
function showApp(){gate.style.display='none';document.querySelector('main').style.display='';document.querySelector('aside').style.display='';let b=document.getElementById('cloudControls');if(!b){b=document.createElement('div');b.id='cloudControls';b.className='panel';b.style.marginTop='16px';document.querySelector('main').appendChild(b)}b.innerHTML='<b>☁️ Sincronização Firebase</b><p class="hint">Os registros desta conta são sincronizados entre aparelhos. Não abra e edite simultaneamente nos dois aparelhos.</p><button class="secondary" id="importLocal">Importar dados antigos deste navegador</button> <button class="secondary" id="logoutCloud">Sair da conta</button>';document.getElementById('importLocal').onclick=importLocal;document.getElementById('logoutCloud').onclick=()=>signOut(auth);}
async function importLocal(){if(!valid(localOriginal)){alert('Não há registros antigos neste navegador para importar. Se cadastrou no celular, faça a importação pelo celular.');return}let n=(localOriginal.debts?.length||0)+(localOriginal.fixed?.length||0);if(!confirm(`Importar ${n} contas antigas deste navegador para sua conta Google? Os registros existentes na nuvem serão preservados e os itens de mesmo ID serão atualizados. Faça isso apenas no aparelho que contém seus dados antigos.`))return;let merge=(a,b)=>{let map=new Map((a||[]).map(x=>[x.id,x]));(b||[]).forEach(x=>map.set(x.id,x));return [...map.values()]};const old=JSON.parse(JSON.stringify(data));data={...data,debts:merge(data.debts,localOriginal.debts),fixed:merge(data.fixed,localOriginal.fixed),notes:merge(data.notes,localOriginal.notes),groups:merge(data.groups,localOriginal.groups)};render();try{await syncCloud();localOriginal=null;alert('Importação enviada para o Firebase! Confira suas contas no painel.')}catch(e){data=old;render();alert('Falha na importação. Seus dados antigos permanecem neste navegador. '+e.message)}}
window.syncCloud=async function(){if(!cloudReady||!cloudRef)return;const payload=JSON.parse(JSON.stringify(data));message('☁️ Salvando...');const job=writing.then(async()=>{await setDoc(cloudRef,{...payload,updatedAt:Date.now()});lastCloudJson=JSON.stringify(payload);message('☁️ Salvo na nuvem ✓')});writing=job.catch(e=>{message('⚠️ Erro ao sincronizar: '+e.code);console.error(e)});await job};
login.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){await signInWithRedirect(auth,new GoogleAuthProvider())}else gateMessage.textContent='Erro ao entrar: '+e.message}};
getRedirectResult(auth).catch(e=>gateMessage.textContent='Erro no login: '+e.message);
onAuthStateChanged(auth,async user=>{if(unsub){unsub();unsub=null}cloudReady=false;cloudRef=null;if(!user){gate.style.display='grid';document.querySelector('main').style.display='none';document.querySelector('aside').style.display='none';login.style.display='inline-block';gateMessage.textContent='Faça login para acessar seus dados sincronizados.';status.style.display='none';return}login.style.display='none';gateMessage.textContent='Carregando seus dados protegidos...';try{cloudRef=doc(db,'usuarios',user.uid,'dados','financeiro');const snap=await getDoc(cloudRef);if(snap.exists()&&valid(snap.data())){data={...snap.data(),groups:Array.isArray(snap.data().groups)?snap.data().groups:[]};lastCloudJson=JSON.stringify(data)}else{data={debts:[],fixed:[],notes:[],groups:[]};lastCloudJson=JSON.stringify(data)}cloudReady=true;render();showApp();message('☁️ Conectado · '+user.email);unsub=onSnapshot(cloudRef,snapshot=>{if(!snapshot.exists()||!valid(snapshot.data()))return;const incoming={...snapshot.data(),groups:Array.isArray(snapshot.data().groups)?snapshot.data().groups:[]};delete incoming.updatedAt;if(JSON.stringify(incoming)===lastCloudJson)return;if(JSON.stringify(incoming)===JSON.stringify(data))return;data=incoming;lastCloudJson=JSON.stringify(incoming);render();message('☁️ Dados atualizados ✓')},e=>message('⚠️ Falha ao receber atualizações: '+e.code));}catch(e){gate.style.display='grid';gateMessage.textContent='Não foi possível abrir os dados: '+e.message;login.style.display='inline-block';message('⚠️ Verifique as regras do Firestore e os domínios autorizados')}});
</script></body></html>
